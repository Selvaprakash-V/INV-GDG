# Production-like local topology (HLD steps 5-8):
#   nginx load balancer -> 2 stateless app replicas -> MongoDB replica set (+ Redis cache)
#   scheduler sidecar -> /api/internal/* (job worker tick + daily expiry digest)
#
#   cp .env.example .env   # set NEXTAUTH_SECRET and CRON_SECRET
#   docker compose up --build
#   open http://localhost:8080

name: trackit

x-app-env: &app-env
  NODE_ENV: production
  MONGODB_URI: mongodb://mongo:27017/trackit?replicaSet=rs0
  MONGODB_READ_PREFERENCE: ${MONGODB_READ_PREFERENCE:-primary}
  REDIS_URL: redis://redis:6379
  NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:8080}
  NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET in .env}
  CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in .env}
  APP_URL: ${APP_URL:-http://localhost:8080}
  APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
  NOTIFIER: ${NOTIFIER:-console}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  ALLOW_ADMIN_SIGNUP: ${ALLOW_ADMIN_SIGNUP:-true}

services:
  mongo:
    image: mongo:8.0
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      # Initiates the single-node replica set on first boot (transactions need a replica set).
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  app:
    build: .
    environment: *app-env
    deploy:
      replicas: 2
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }

  lb:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes: ["./deploy/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [app]

  scheduler:
    image: curlimages/curl:8.11.1
    environment:
      CRON_SECRET: ${CRON_SECRET}
    depends_on: [lb]
    entrypoint: ["/bin/sh", "/scheduler.sh"]
    volumes: ["./deploy/scheduler.sh:/scheduler.sh:ro"]

volumes:
  mongo-data:
