worker_processes auto;
events { worker_connections 1024; }

http {
  # Docker's DNS; re-resolve so scaled replicas are picked up.
  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream trackit_app {
    zone trackit_app 64k;
    least_conn;                       # route to the least busy replica
    server app:3000 resolve max_fails=3 fail_timeout=10s;
    keepalive 32;
  }

  # Edge rate limit (defence in depth; the app also rate-limits per user/IP).
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

  gzip on;
  gzip_types application/json text/css application/javascript image/svg+xml;

  server {
    listen 80;
    server_tokens off;
    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 30s;

    location /_next/static/ {
      proxy_pass http://trackit_app;
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://trackit_app;
      proxy_next_upstream error timeout http_502 http_503;
    }

    location / {
      proxy_pass http://trackit_app;
    }
  }
}
